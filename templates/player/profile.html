{% extends "player/base.html" %}

{% block title %}Profile — LFR{% endblock %}

{% block content %}
<h2>Profile</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <label>
        {{ field.label }}
        {{ field }}
        {% if field.errors %}
        <small class="text-error">{{ field.errors.0 }}</small>
        {% endif %}
        {% if field.help_text %}
        <small class="text-muted">{{ field.help_text }}</small>
        {% endif %}
    </label>
    {% endfor %}
    <button type="submit">Save</button>
</form>
{% endblock %}
