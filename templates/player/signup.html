<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up — LFR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container" style="max-width: 400px; margin-top: 10vh;">
        <article>
            <header>
                <h2>LFR — Sign Up</h2>
            </header>

            {% if form.errors %}
            {% for field, errors in form.errors.items %}
            {% for error in errors %}
            <p style="color: var(--pico-del-color);">{{ error }}</p>
            {% endfor %}
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}" required autofocus>

                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>

                <label for="id_password_confirm">Confirm Password</label>
                <input type="password" name="password_confirm" id="id_password_confirm" required>

                <button type="submit">Sign up</button>
            </form>

            <p style="text-align:center">Already have an account? <a href="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">Log in</a></p>
        </article>
    </main>
</body>
</html>
