<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — LFR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container" style="max-width: 400px; margin-top: 10vh;">
        <article>
            <header>
                <h2>LFR — Log In</h2>
            </header>

            {% if form.errors %}
            <p style="color: var(--pico-del-color);">Invalid email or password.</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label for="id_username">Email</label>
                <input type="email" name="username" id="id_username" required autofocus>

                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>

                <button type="submit">Log in</button>
            </form>

            {% load socialaccount %}
            <hr>
            <p style="text-align:center; opacity:0.7; font-size:0.9em;">Or continue with</p>
            <div style="display:flex; flex-direction:column; gap:0.5em;">
                <a href="{% provider_login_url 'google' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" role="button" class="outline">Google</a>
                <a href="{% provider_login_url 'discord' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" role="button" class="outline">Discord</a>
                <a href="{% provider_login_url 'facebook' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" role="button" class="outline">Facebook</a>
            </div>

        </article>
    </main>
</body>
</html>
