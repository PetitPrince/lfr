<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — LFR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container" style="max-width: 400px; margin-top: 10vh;">
        <article>
            <header>
                <h2>LFR — Log In</h2>
            </header>

            {% if form.errors %}
            <p style="color: var(--pico-del-color);">Invalid email or password.</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label for="id_username">Email</label>
                <input type="email" name="username" id="id_username" required autofocus>

                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>

                <button type="submit">Log in</button>
            </form>

            <p style="text-align:center">Don't have an account? <a href="{% url 'accounts:signup' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">Sign up</a></p>
        </article>
    </main>
</body>
</html>
